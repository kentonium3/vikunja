name: ci

env:
  DO_NOT_TRACK: 1

on:
  pull_request:
  merge_group:
  push:
    tags:
      - v*
    branches:
      - main

concurrency:
  # main merges use a unique run_id so they don't cancel each other
  # other branches or PRs share a group to auto-cancel old runs
  group: ${{ github.ref == 'refs/heads/main' &&
    format('{0}-{1}', github.workflow, github.run_id) ||
    format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    name: Release
    if: (github.ref_type == 'tag' || github.ref_name == 'main') && github.repository == 'go-vikunja/vikunja'
    uses: ./.github/workflows/release.yml
    # Called workflows can only narrow these, never widen them.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - test
    secrets: inherit

  harness-provenance:
    name: harness-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record tested tree
        run: printf '%s-%s tree=%s sha=%s\n' HARNESS TESTED-TREE "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse HEAD)"
